server {
    listen 80;
    server_name geotech-gec.online www.geotech-gec.online;

    location / {
        proxy_pass http://localhost:5174;  # frontend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://localhost:3004;  # backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name geotech-gec.online www.geotech-gec.online;

    ssl_certificate /etc/letsencrypt/live/geotech-gec.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geotech-gec.online/privkey.pem;

    location / {
        proxy_pass http://localhost:5174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://localhost:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
