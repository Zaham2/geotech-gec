version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: geotech-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: geotech
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - geotech-network

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geotech-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/geotech-db
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PORT: 3001
      NODE_ENV: production
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - geotech-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geotech-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: https://geotech-gec.online/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - geotech-network

  # Redis (for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: geotech-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - geotech-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: geotech-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - geotech-network

volumes:
  postgres_data:
  redis_data:

networks:
  geotech-network:
    driver: bridge

# Certbot for SSL
x-certbot:
  image: certbot/certbot
  container_name: geotech-certbot
  volumes:
    - ./certbot/conf:/etc/letsencrypt
    - ./certbot/www:/var/www/certbot
